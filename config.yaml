data_source:
  provider: csqaq
  endpoint: https://api.csqaq.com/api/v1/info/exchange_detail
  bind_local_ip: true
  bind_ip_endpoint: https://api.csqaq.com/api/v1/sys/bind_local_ip
  request_timeout_seconds: 30
  retries: 3
  max_pages: 1000

platforms:
  - BUFF
  - YYYP

steam:
  net_rate: 0.869

filters:
  volume:
    enabled: true
    min_today_volume: 100
  price:
    enabled: false
    min: 1
    max: 5000
  ratio:
    enabled: true
    min: 0.50
    max: 1.00
  steam_buy_orders:
    enabled: false
    min: 0
  platform_sell_orders:
    enabled: false
    min: 0

index:
  percentiles:
    - 0.05
    - 0.10
    - 0.20
  primary: 0.10
  market_value_platform: BUFF
  min_valid_items: 100

history:
  moving_averages:
    - 7
    - 30
  percentile_windows:
    - 30
    - 180

notification:
  enabled: true
  provider: ntfy
  special_percentile: 90

top_items:
  enabled: true
  count: 10

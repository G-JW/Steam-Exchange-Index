name: Daily Steam Exchange Index

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-exchange-index-daily
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Calculate index
        env:
          CSQAQ_API_TOKEN: ${{ secrets.CSQAQ_API_TOKEN }}
          NTFY_DAILY_URL: ${{ secrets.NTFY_DAILY_URL }}
          NTFY_ALERT_URL: ${{ secrets.NTFY_ALERT_URL }}
        run: python main.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: update daily exchange index"
          git push
